name: Deploy to Dev

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Dev
        run: |
          echo "Deploying to dev environment..."
          echo "Commit: ${{ github.sha }}"
          echo "Deployment successful!"
